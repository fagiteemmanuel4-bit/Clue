<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clue Test Console</title><style>body{font:15px system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 18px;background:#000;color:#fff}button{padding:10px 14px;margin:6px 6px 6px 0;border:1px solid #444;border-radius:8px;background:#111;color:#fff;cursor:pointer}pre{white-space:pre-wrap;background:#111;padding:14px;border-radius:10px}h1{font-size:28px}.ok{color:#8f8}.bad{color:#f88}</style></head><body><h1>Clue production test console</h1><p>This lightweight GitHub Pages console tests the deployed Clue HTTP endpoints. It does not contain secrets.</p><button onclick="health()">Test production health</button><button onclick="file('docx')">Test DOCX auth</button><button onclick="file('pdf')">Test PDF auth</button><button onclick="file('xlsx')">Test XLSX auth</button><button onclick="file('pptx')">Test PPTX auth</button><button onclick="file('zip')">Test ZIP auth</button><pre id="out">Ready.</pre><script>const base='https://clue-nmmn.vercel.app';const out=document.getElementById('out');async function health(){out.textContent='Testing…';try{const r=await fetch(base+'/api/health',{cache:'no-store'});const t=await r.text();out.textContent=`HTTP ${r.status}\n${t}`}catch(e){out.textContent='Network/CORS error: '+e}}async function file(format){out.textContent='Testing '+format+' authentication…';try{const r=await fetch(base+'/api/files/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({format,text:'Clue production test',title:'Test',rows:[['A','B'],['1','2']],slides:[{title:'Test',text:'Clue'}],files:[{name:'test.txt',content:'Clue'}]})});const b=await r.arrayBuffer();out.textContent=`${format.toUpperCase()}\nHTTP ${r.status}\nMIME: ${r.headers.get('content-type')}\nBytes: ${b.byteLength}\nContent-Disposition: ${r.headers.get('content-disposition')||'(none)'}\n\nExpected for unauthenticated browser: HTTP 401.`}catch(e){out.textContent='Network/CORS error: '+e}}</script></body></html>
