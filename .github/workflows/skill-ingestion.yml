name: Clue Skill Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ingest external SKILL.md files
        run: node scripts/ingest-skills.mjs
      - name: Commit updated skill registry
        run: |
          git config user.name 'clue-skill-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/external
          git diff --cached --quiet || git commit -m 'chore(skills): refresh external skill registry'
          git push
