name: Apply file chat UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'chore(files): apply generated file chat UI')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch UI
        run: node scripts/patch-file-chat-ui.mjs
      - name: Add compact file-card styles
        run: |
          cat >> app/clue-overrides.css <<'EOF'
          .file-card{display:flex;align-items:center;gap:10px;width:min(100%,420px);padding:10px 12px;border:1px solid rgba(127,127,127,.22);border-radius:14px;background:rgba(127,127,127,.06);margin:8px 0}
          .file-card-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(127,127,127,.12);flex:0 0 auto}.file-card-icon svg{width:17px;height:17px}
          .file-card-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}.file-card-info strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-card-info small{font-size:11px;opacity:.62}
          .file-card-download{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;text-decoration:none;flex:0 0 auto}.file-card-download:hover{background:rgba(127,127,127,.14)}.file-card-download svg{width:17px;height:17px}
          EOF
      - name: Commit patch and remove patcher workflow
        run: |
          git config user.name "Clue Automation"
          git config user.email "actions@github.com"
          git add app/page.tsx app/clue-overrides.css .github/workflows/apply-file-chat-ui-patch.yml
          git rm .github/workflows/apply-file-chat-ui-patch.yml
          git commit -m "chore(files): apply generated file chat UI" || exit 0
          git push
